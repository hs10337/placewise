    <meta name="theme-color" content="#D9F2F4" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('placewise.studio.theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch {}
        let systemDark = false;
        try { systemDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches; } catch {}
        const mode = preference === 'dark' || (preference === 'system' && systemDark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>

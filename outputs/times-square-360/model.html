<body>
<div id="times-square-world" aria-label="Interactive Times Square 3D viewer">
  <style>
    #times-square-world{--ts-ink:#f6f3ee;--ts-muted:#b0bac8;--ts-surface:#121b2b;--ts-line:#ffffff24;position:relative;isolation:isolate;overflow:hidden;background:#101929;color:var(--ts-ink);font-family:Arial,Helvetica,sans-serif;min-width:0;color-scheme:dark}
    #times-square-world *{box-sizing:border-box}
    #times-square-world button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #times-square-world button:focus-visible,#times-square-world a:focus-visible{outline:2px solid #bfff78;outline-offset:4px}
    #times-square-world button:disabled{opacity:.4;cursor:not-allowed}
    #times-square-world .ts-stage{height:660px;position:relative;touch-action:none;cursor:grab;overflow:hidden}

    #times-square-world canvas{display:block;width:100%;height:100%}

    #times-square-world .ts-tools{width:max-content;max-width:100%;margin:0 auto;display:flex;align-items:center;gap:4px;background:#192334f2;border:1px solid #ffffff20;border-radius:12px;padding:6px;box-shadow:0 8px 40px #0004;pointer-events:auto}

    #times-square-world .ts-foot{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:18px;font-size:11px;letter-spacing:.04em;color:#aeb9c9}

    #times-square-world .ts-foot a:hover{color:#fff;text-decoration:underline}
    #times-square-world .ts-gesture{position:absolute;bottom:124px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.04em;color:#c5cfdf;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity .5s;text-shadow:0 2px 12px #000}
    #times-square-world .ts-compass{position:absolute;right:28px;top:126px;width:44px;height:44px;border:1px solid #ffffff30;border-radius:50%;z-index:2;display:grid;place-items:center;color:#d8e0eb;font-size:10px;pointer-events:none;background:#10192980}

    #times-square-world .ts-marker{position:absolute;z-index:2;left:0;top:0;transform:translate(-50%,-100%);font-size:10px;letter-spacing:.02em;color:#dbe3ef;pointer-events:none;white-space:nowrap;text-shadow:0 1px 5px #000,0 1px 12px #000;background:#111a29b0;padding:5px 8px;border-radius:4px}
    #times-square-world .ts-marker:after{content:"";position:absolute;bottom:-13px;left:50%;width:1px;height:13px;background:#c6d4e380}

    @media(max-width:600px){#times-square-world .ts-stage{height:610px}#times-square-world .ts-head{padding:24px}#times-square-world .ts-title{font-size:36px}#times-square-world .ts-edition{display:none}#times-square-world .ts-compass{right:24px;top:28px}#times-square-world .ts-tools{gap:2px;padding:5px;flex-wrap:wrap;justify-content:center}#times-square-world .ts-tools button{padding:10px;min-height:42px}#times-square-world .ts-tools button.ts-icon{width:32px}#times-square-world .ts-bottom{padding:24px 12px 16px}#times-square-world .ts-foot{font-size:9px;gap:8px}#times-square-world .ts-gesture{bottom:122px;font-size:10px}#times-square-world .ts-hide-mobile{display:none}#times-square-world .ts-marker{font-size:9px}}
    @media(max-width:600px){#times-square-world .ts-stage{height:650px}#times-square-world .ts-tools{display:grid;grid-template-columns:repeat(4,1fr);width:304px;max-width:100%}#times-square-world .ts-tools button[data-action="overview"],#times-square-world .ts-tools button[data-action="street"]{grid-column:span 2}#times-square-world .ts-tools button[data-action="rotate"],#times-square-world .ts-separator{display:none}#times-square-world .ts-tools button.ts-icon{width:100%}#times-square-world .ts-foot{font-size:11px;flex-direction:column;gap:7px;margin-top:14px}#times-square-world .ts-credit{max-width:100%}#times-square-world .ts-gesture{bottom:173px}#times-square-world .ts-marker{font-size:11px}#times-square-world .ts-kicker{font-size:11px;letter-spacing:.1em}#times-square-world .ts-compass{top:103px}}

  <div class="ts-head">

  <script type="module">
  (async()=>{
  const root=document.getElementById('times-square-world');
  const loading=root.querySelector('.ts-loading');
  try {
  const THREE=await import('https://esm.sh/three@0.160.1');
  function createBillboardTextures(THREE) {
  const result = {};
  const font = 'Arial, Helvetica, sans-serif';
  const make = (name, width, height, paint) => {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    paint(ctx, width, height);
    // A fine LED matrix keeps the screens luminous without softening their type.
    ctx.fillStyle = 'rgba(0,0,0,.11)';
    for (let y = 0; y < height; y += 5) ctx.fillRect(0, y, width, 1);
    const texture = new THREE.CanvasTexture(canvas);
    if (THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 4;
    result[name] = texture;
  };
  const type = (ctx, text, x, y, size, color, weight = 900, align = 'left') => {
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, x, y);
  };
  const gradient = (ctx, width, height, colors, horizontal = false) => {
    const g = ctx.createLinearGradient(0, 0, horizontal ? width : 0, horizontal ? 0 : height);
    colors.forEach((c, i) => g.addColorStop(i / (colors.length - 1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);
  };

  make('timesSquare', 1024, 512, (ctx, w, h) => {
    ctx.fillStyle = '#baff18'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#07170f'; ctx.fillRect(694, 0, 330, h);
    type(ctx, 'NEW YORK', 36, 64, 38, '#07170f', 800);
    type(ctx, 'NYC', 19, 343, 306, '#07170f');
    type(ctx, 'ALWAYS ON.', 39, 459, 61, '#07170f');
    ctx.save(); ctx.translate(853, 268); ctx.rotate(-Math.PI / 2);
    type(ctx, 'TIMES SQUARE', 0, 26, 70, '#f7ffec', 900, 'center'); ctx.restore();
    ctx.strokeStyle = '#baff18'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(854, 80, 24, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#baff18'; ctx.fillRect(733, 454, 250, 8);
  });

  make('broadway', 512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#ffdb21'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#f13c2d';
    ctx.beginPath(); ctx.moveTo(256, 52); ctx.lineTo(460, 512); ctx.lineTo(51, 512); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#17151d'; ctx.fillRect(26, 24, 460, 44);
    type(ctx, 'THE CITY IS YOUR STAGE', 256, 55, 23, '#ffef97', 800, 'center');
    type(ctx, 'BROAD', 256, 218, 108, '#17151d', 900, 'center');
    type(ctx, 'WAY', 256, 334, 149, '#17151d', 900, 'center');
    type(ctx, 'LIGHTS UP.', 256, 412, 45, '#fff6d3', 900, 'center');
    type(ctx, 'EVERY NIGHT', 256, 461, 26, '#17151d', 800, 'center');
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = '#fffce0'; ctx.beginPath(); ctx.arc(12 + i * 44, 493, 4, 0, Math.PI * 2); ctx.fill();
    }
  });

  make('wave', 1024, 512, (ctx, w, h) => {
    gradient(ctx, w, h, ['#0a0a52', '#2114ad', '#6605ed'], true);
    for (let i = 25; i >= 0; i--) {
      const t = i / 25;
      ctx.strokeStyle = `hsla(${171 + t * 65}, 100%, ${65 - t * 33}%, ${0.95 - t * 0.4})`;
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.moveTo(-100, 375 + i * 7);
      ctx.bezierCurveTo(180, -250 + i * 12, 680, 770 - i * 8, 1120, 35 + i * 7);
      ctx.stroke();
    }
    type(ctx, 'FEEL', 42, 132, 128, '#f3fcff');
    type(ctx, 'EVERYTHING.', 42, 236, 94, '#f3fcff');
    type(ctx, 'A NEW FREQUENCY', 47, 462, 30, '#95ffef', 700);
    ctx.strokeStyle = '#95ffef'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(935, 447, 26, 0, Math.PI * 2); ctx.stroke();
  });

  make('fashion', 512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#f2ede1'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#df542e'; ctx.beginPath(); ctx.arc(357, 258, 160, 0, Math.PI * 2); ctx.fill();
    // A graphic coat silhouette, intentionally illustrative rather than a real campaign.
    ctx.fillStyle = '#17191c';
    ctx.beginPath(); ctx.ellipse(349, 145, 36, 45, -.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(318, 181); ctx.lineTo(384, 183); ctx.lineTo(424, 253);
    ctx.lineTo(442, 367); ctx.lineTo(411, 379); ctx.lineTo(384, 285);
    ctx.lineTo(405, 475); ctx.lineTo(282, 475); ctx.lineTo(300, 271);
    ctx.lineTo(266, 370); ctx.lineTo(237, 359); ctx.lineTo(275, 242); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#aaa69f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(318, 189); ctx.lineTo(345, 262); ctx.lineTo(380, 188);
    ctx.moveTo(345, 262); ctx.lineTo(341, 465); ctx.stroke();
    type(ctx, 'FORM', 24, 91, 96, '#17191c');
    type(ctx, 'NEW', 29, 235, 59, '#17191c');
    type(ctx, 'YORK', 28, 294, 59, '#17191c');
    type(ctx, 'IN MOTION', 28, 337, 24, '#17191c', 700);
    ctx.fillStyle = '#17191c'; ctx.fillRect(0, 480, w, 32);
    type(ctx, 'THE EVERYDAY, REIMAGINED', 256, 502, 17, '#f2ede1', 700, 'center');
  });

  make('garden', 512, 512, (ctx, w, h) => {
    gradient(ctx, w, h, ['#003e3c', '#00764b', '#032c2a']);
    const leaf = (x, y, scale, angle, color) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-135, -50, -102, -173, 0, -230);
      ctx.bezierCurveTo(90, -160, 105, -54, 0, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(232,255,123,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -211); ctx.stroke(); ctx.restore();
    };
    leaf(38, 269, 1.3, -.65, '#0ba769');
    leaf(206, 241, .95, -.73, '#6acf45');
    leaf(420, 246, 1.2, .6, '#159259');
    leaf(504, 478, 1.5, -.28, '#1cc179');
    leaf(68, 588, 1.65, .58, '#10884a');
    ctx.fillStyle = 'rgba(0,31,25,.38)'; ctx.fillRect(0, 171, w, 192);
    type(ctx, 'BREATHE', 256, 259, 76, '#efffba', 900, 'center');
    type(ctx, 'A LITTLE DEEPER.', 256, 315, 34, '#efffba', 700, 'center');
    type(ctx, 'FIND YOUR GREEN', 256, 471, 25, '#e0ffae', 800, 'center');
  });

  make('sunset', 1024, 512, (ctx, w, h) => {
    gradient(ctx, w, h, ['#7e1aa8', '#f26480', '#ffb958']);
    ctx.fillStyle = '#ffed98'; ctx.beginPath(); ctx.arc(743, 260, 165, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#733098'; ctx.beginPath(); ctx.moveTo(0, 435); ctx.lineTo(160, 319);
    ctx.lineTo(312, 391); ctx.lineTo(510, 312); ctx.lineTo(657, 405); ctx.lineTo(857, 352);
    ctx.lineTo(1024, 415); ctx.lineTo(1024, 512); ctx.lineTo(0, 512); ctx.fill();
    ctx.fillStyle = '#261557'; ctx.beginPath(); ctx.moveTo(0, 443); ctx.lineTo(252, 424);
    ctx.lineTo(425, 465); ctx.lineTo(695, 410); ctx.lineTo(1024, 457);
    ctx.lineTo(1024, 512); ctx.lineTo(0, 512); ctx.fill();
    type(ctx, 'GO', 37, 239, 228, '#fff7d3');
    type(ctx, 'SOMEWHERE.', 44, 333, 83, '#fff7d3');
    type(ctx, 'MAKE ROOM FOR WONDER', 45, 478, 28, '#ffc98a', 800);
  });

  make('cola', 512, 512, (ctx, w, h) => {
    gradient(ctx, w, h, ['#ed122d', '#ec3035', '#bc0020']);
    ctx.save(); ctx.translate(256, 263); ctx.rotate(-.13);
    ctx.strokeStyle = '#ff797a'; ctx.lineWidth = 32;
    ctx.beginPath(); ctx.arc(0, 0, 211, 0, Math.PI * 2); ctx.stroke();
    type(ctx, 'POP!', 0, 36, 166, '#fff7e7', 900, 'center'); ctx.restore();
    type(ctx, 'BRIGHTEN', 256, 86, 43, '#fff7e7', 900, 'center');
    type(ctx, 'YOUR NIGHT', 256, 137, 43, '#fff7e7', 900, 'center');
    type(ctx, 'OPEN THE MOMENT', 256, 458, 29, '#fff7e7', 800, 'center');
    for (let i = 0; i < 12; i++) {
      const x = 20 + ((i * 137) % 476), y = 148 + ((i * 79) % 215);
      ctx.fillStyle = 'rgba(255,244,208,.62)'; ctx.beginPath(); ctx.arc(x, y, 3 + i % 5, 0, Math.PI * 2); ctx.fill();
    }
  });

  make('ticker', 1024, 128, (ctx, w, h) => {
    ctx.fillStyle = '#080d16'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fdb832'; ctx.fillRect(0, 0, w, 5); ctx.fillRect(0, h - 5, w, 5);
    type(ctx, 'NEW YORK  /  THE CITY NEVER SLEEPS', 28, 85, 48, '#ffc443', 800);
  });

  return result;
}

  const stage=root.querySelector('.ts-stage');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#101929');
scene.fog=new THREE.Fog('#101929',1300,2200);
const camera=new THREE.PerspectiveCamera(38,1,.1,1600);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const world=new THREE.Group();scene.add(world);
const hemi=new THREE.HemisphereLight('#b8d3ff','#747784',2.1);scene.add(hemi);
const moon=new THREE.DirectionalLight('#b4c9ff',2.9);moon.position.set(-160,240,120);moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{left:-220,right:220,top:240,bottom:-240,near:1,far:700});moon.shadow.bias=-.0007;moon.shadow.normalBias=.3;scene.add(moon);
const rim=new THREE.DirectionalLight('#efb7a0',1.8);rim.position.set(200,90,-110);scene.add(rim);
let seed=217;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const materials=new Map();
function mat(color,roughness=.78,metalness=.1){const key=color+':'+roughness+':'+metalness;if(!materials.has(key))materials.set(key,new THREE.MeshStandardMaterial({color,roughness,metalness}));return materials.get(key);}
const unitBox=new THREE.BoxGeometry(1,1,1);
function box(parent,w,h,d,x,y,z,material,shadow=true){const mesh=new THREE.Mesh(unitBox,material);mesh.scale.set(w,h,d);mesh.position.set(x,y,z);mesh.castShadow=shadow;mesh.receiveShadow=true;parent.add(mesh);return mesh;}
function cylinder(parent,r1,r2,h,x,y,z,material,sides=12){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,sides),material);mesh.position.set(x,y,z);mesh.castShadow=true;parent.add(mesh);return mesh;}
const dark=mat('#252f40'),concrete=mat('#a0a8b6'),roofMat=mat('#48515f'),steel=mat('#67768b',.42,.55);
function canvasTexture(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);return t;}
const signs=createBillboardTextures(THREE);
Object.values(signs).forEach(t=>{t.anisotropy=8;});
const facadeTextures={};
for(const style of ['glass','stone','dark','brick']){
 facadeTextures[style]=canvasTexture(512,1024,(c,w,h)=>{
   const bg={glass:'#3d5367',stone:'#9b9c9b',dark:'#445063',brick:'#857667'}[style];c.fillStyle=bg;c.fillRect(0,0,w,h);
   const cols=style==='glass'?12:8,rows=32,cw=w/cols,rh=h/rows;
   for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const r=rand();c.fillStyle=r>.82?'#fff0bd':r>.62?'#b5c3c0':r>.35?'#405b70':'#263b50';
    c.fillRect(col*cw+cw*.19,row*rh+rh*.15,cw*.61,rh*.72);
    c.fillStyle='#1d2c3930';c.fillRect(col*cw+cw*.19,row*rh+rh*.65,cw*.61,rh*.12);
   }
   if(style==='glass'){c.fillStyle='#adb9c838';for(let i=0;i<cols;i++)c.fillRect(i*cw,0,2,h);c.fillStyle='#87a1b228';for(let r=0;r<rows;r++)c.fillRect(0,r*rh,w,2);}
 });
}
function building(name,x,z,w,d,h,style='glass',color='#bac4d1'){
 const g=new THREE.Group();g.position.set(x,0,z);g.name=name;world.add(g);

function dispose(){if(disposed)return;disposed=true;cancelAnimationFrame(frame);resizeObserver.disconnect();observer.disconnect();const geometries=new Set(),mats=new Set(),textures=new Set();scene.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m));});mats.forEach(m=>{if(m.map)textures.add(m.map);if(m.emissiveMap)textures.add(m.emissiveMap);m.dispose();});geometries.forEach(g=>g.dispose());textures.forEach(t=>t.dispose());renderer.dispose();}

lastTime=performance.now();animate(lastTime);loading.hidden=true;
root.dataset.ready='true';

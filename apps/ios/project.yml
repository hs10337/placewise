name: Placewise
options:
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.placewise.app
    SWIFT_VERSION: 5.10
targets:
  Placewise:
    type: application
    platform: iOS
    sources:
      - path: Placewise
    info:
      path: Placewise/Info.plist
      properties:
        CFBundleDisplayName: Placewise
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Placewise uses your location to show nearby place context.
        NSLocationTemporaryUsageDescriptionDictionary:
          MapExploration: Improve map-centering and nearby place selection.
    settings:
      base:
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
